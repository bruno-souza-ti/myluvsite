<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valentina &amp; Bruno</title>

    <!--
  ============================================================
  COMO PERSONALIZAR ESTE SITE (leia antes de enviar!)
  ============================================================
  1. Abra js/config.js — é o único arquivo que você precisa editar.
     Troque os nomes, a data em que vocês ficaram juntos, o texto da
     carta e os motivos que você ama nela.
  2. Para trocar as fotos: coloque os arquivos dentro de assets/fotos/
     e troque cada `{ placeholder: true }` da lista `photos` em
     js/config.js por `{ img: "assets/fotos/arquivo.jpg", alt: "descrição" }`.
  3. Se trocar os nomes, atualize também o <title> e as tags og: aqui
     embaixo — esses textos aparecem quando o link é compartilhado
     (WhatsApp, etc.) e não vêm do config.js, pois são lidos antes do
     site carregar.
  4. Pronto! Só abrir o arquivo .html no navegador (duplo clique) já funciona.
  ============================================================
-->

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♡</text></svg>"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Valentina & Bruno" />
    <meta
      property="og:description"
      content="Um cantinho só nosso — nosso contador, nossa carta e nossos momentos."
    />
    <meta
      property="og:image"
      content="https://bruno-souza-ti.github.io/myluvsite/assets/fotos/IMG-20260818-WA0071.jpg"
    />
    <meta
      property="og:url"
      content="https://bruno-souza-ti.github.io/myluvsite/"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="petals" id="petals"></div>

    <!-- HERO -->
    <section class="hero">
      <div class="hero-eyebrow">um cantinho só nosso</div>
      <h1 class="hero-names" id="heroNames">
        Meu Amor
        <span class="amp">&amp;</span>
        Eu
      </h1>
      <div class="counter-wrap" id="counterWrap"></div>
      <div class="counter-since" id="counterSince"></div>
      <div class="scroll-hint">
        <span>role para ver mais</span><span class="arrow">↓</span>
      </div>
    </section>

    <!-- CARTA -->
    <section class="letter-section">
      <h2 class="env-title display">Uma cartinha pra você</h2>
      <p class="env-sub">Clique no envelope para abrir.</p>

      <div>
        <div class="envelope" id="envelope">
          <div class="flap"></div>
          <div class="seal">♡</div>
          <div class="letter-paper"></div>
          <div class="body"></div>
        </div>
        <div class="tap-hint">toque para abrir</div>
      </div>

      <div class="letter-full" id="letterFull"></div>
    </section>

    <!-- MOTIVOS -->
    <section class="reasons-section">
      <h2 class="reasons-title display">Motivos que eu te amo</h2>
      <p class="reasons-sub">Toque em cada cartão para virar.</p>
      <div class="reasons-grid" id="reasonsGrid"></div>
    </section>

    <!-- GALERIA -->
    <section class="gallery-section">
      <h2 class="gal-title display">Nossos momentos</h2>
      <p class="gal-sub">Alguns instantes que eu guardo com carinho.</p>
      <div class="marquee" id="marquee">
        <div class="marquee-row">
          <div class="marquee-track" id="track"></div>
        </div>
      </div>
    </section>

    <!-- FOOTER -->
    <section class="footer">
      <div class="heart">♡</div>
      <p>feito com carinho, só pra você</p>
    </section>

    <!-- LIGHTBOX -->
    <div class="lightbox-overlay" id="lightboxOverlay">
      <button class="lightbox-close" id="lightboxClose" aria-label="Fechar">✕</button>
      <button class="lightbox-prev" id="lightboxPrev" aria-label="Foto anterior">‹</button>
      <figure class="lightbox-figure">
        <img id="lightboxImg" src="" alt="" />
        <figcaption class="lightbox-caption" id="lightboxCaption"></figcaption>
      </figure>
      <button class="lightbox-next" id="lightboxNext" aria-label="Próxima foto">›</button>
    </div>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
